# lightning.pytorch==2.6.4
seed_everything: 42
model:
  input_size: 1800
  num_labels: 4
  hidden_sizes:
  - 1000
  - 200
  - 20
  dropout_rate: 0.4
  lr: 0.00001
  weight_decay: 0.01
data:
  path: datasets/mms.parquet
  transform: null
  batch_size: 64
  split:
  - 0.80
  - 0.10
  - 0.10
optimizer: null
lr_scheduler: null
ckpt_path: null
weights_only: null
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger: null
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_MultilabelF1Score
        save_top_k: 3
        filename: "best-f1-{epoch:02d}-{val_f1:.2f}"
        mode: max
  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
