# lightning.pytorch==2.6.4
seed_everything: 42
model:
  class_path: cbl.models.MultiLabelSplitThreshClassifier
  init_args:
    input_size: 1800
    num_labels: 4
    hidden_sizes:
    - 2000
    - 1000
    - 100
    dropout_rate: 0.5
    lr: 1.0e-05
    weight_decay: 0.01
data:
  path: datasets/merged.parquet
  transform:
    class_path: cbl.data.transforms.Interpolate
    init_args:
      target_range: [4000, 400]
      target_len: 1800
      kind: "linear"
  batch_size: 64
  num_workers: 10
  split:
  - 0.8
  - 0.1
  - 0.1
optimizer: null
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 10
    eta_min: 0.0
    last_epoch: -1
ckpt_path: null
weights_only: null
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: best-f1-{epoch:02d}-{val_f1:.2f}
      monitor: val_MultilabelF1Score
      verbose: false
      save_last: true
      save_top_k: 3
      save_on_exception: false
      save_weights_only: false
      mode: max
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: true
      log_weight_decay: true
  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 100
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
